name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Pack check
        run: |
          npm pack --dry-run
          node -e "const p=require('./package.json'); if(p.name.startsWith('@local/')) { console.error('Refuse to publish under @local scope:', p.name); process.exit(1); }"
